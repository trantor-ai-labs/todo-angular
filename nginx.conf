# Serve the app and the API from one origin.
#
# This is what lets the same built bundle work unchanged for a person on their laptop, for the
# conformance run inside a container network, and for a deployed demo. The app asks its own origin
# for /api; this decides what that means. Without it, every context needs a different absolute URL
# baked into the bundle, and "it works on the demo machine" becomes a real failure mode.
server {
  listen 80;
  server_name _;

  # Exact `/api` as well as `/api/`. Without this, nginx 301s `/api` to `/api/` — harmless for a
  # GET, which the browser re-issues, and silently destructive for a POST, whose body does not
  # survive the redirect. Measured: creates vanished while reads worked, so the app looked fine
  # until a reload.
  location = /api {
    proxy_pass http://backend:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /api;
  }

  location /api/ {
    proxy_pass http://backend:8081/;
    proxy_http_version 1.1;
    # The backend builds each todo's `url` from these. Without the prefix it would hand back
    # http://host/1 for something only reachable at http://host/api/1.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /api;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ =404;
  }
}
